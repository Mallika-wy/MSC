# Paths are relative to this YAML. No models are downloaded.
source:
  dataset: aistpp
  root: ../../../data/AISTpp
motion:
  target_fps: 30
  representation: g1_qpos36
  retarget:
    enabled: auto
    gmr_root: ../../third_party/gmr
    smpl_model: ../../model/smpl/SMPL_MALE.pkl
    gender: male
  tracking:
    enabled: true
    sonic_root: ../../third_party/sonic
    encoder: ../../model/sonic/model_encoder.onnx
    decoder: ../../model/sonic/model_decoder.onnx
    observation_config: ../../model/sonic/observation_config.yaml
    providers: CPUExecutionProvider
audio:
  enabled: true
  model: ../../model/MERT-v1-95M
  device: cuda:0
  chunk_seconds: 5
video:
  enabled: false
text:
  enabled: false
quality:
  strict_joint_limits: false
  arm_twist:
    enabled: true
release:
  output: ../../data/processed/audio/aistpp
  publish_labels:
  - retarget_reference
  - tracker_executed
  train_default: tracker_executed
  max_shard_frames: 1000000
  split_policy: preserve
  alignment_policy: allow_estimated
