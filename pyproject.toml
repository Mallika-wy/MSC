[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msc-motion"
version = "0.1.0"
description = "Minimal multimodal G1 motion flow matching research framework"
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "numpy>=1.24", "PyYAML>=6"]

[project.optional-dependencies]
text = ["transformers>=4.40,<5", "sentencepiece>=0.2", "safetensors"]
data = ["datasets>=2.19", "pyarrow>=14"]
pipeline = ["pyarrow>=14", "scipy>=1.10"]
test = ["pytest>=8"]

[project.scripts]
msc-train = "msc.train:main"
msc-sample = "msc.sample:main"
msc-evaluate = "msc.evaluate:main"
msc-cache-text = "msc.cache_text:main"
msc-data = "data_pipeline.cli:main"

[tool.setuptools]
license-files = ["licenses/*.txt", "THIRD_PARTY.md"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["msc*", "data_pipeline*"]
exclude = ["data_pipeline.tests*"]
namespaces = false

[tool.setuptools.package-data]
msc = ["assets/stats/*.json", "assets/robots/g1/*.json", "assets/robots/g1/*.urdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires local OMG data and T5 assets", "slow: synthetic convergence test"]
