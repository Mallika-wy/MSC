[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msc-motion"
version = "0.1.0"
description = "Minimal multimodal G1 motion flow matching research framework"
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "numpy>=1.24", "PyYAML>=6"]

[project.optional-dependencies]
text = ["transformers>=4.40,<5", "sentencepiece>=0.2", "safetensors"]
data = ["pyarrow>=15"]
pipeline = ["pyarrow>=15", "scipy>=1.10", "transformers>=4.40,<5", "onnxruntime>=1.18", "mujoco>=3.3,<4", "smplx>=0.1.28", "mink>=1.0", "qpsolvers>=4", "daqp>=0.8", "rich>=13", "natsort>=8", "opencv-python>=4"]
pipeline-gpu = ["onnxruntime-gpu>=1.23,<2", "onnx>=1.19"]
test = ["pytest>=8", "pyarrow>=15"]

[project.scripts]
msc-train = "msc.train:main"
msc-sample = "msc.sample:main"
msc-execute = "msc.execute:main"
msc-evaluate = "msc.evaluate:main"
msc-data = "data_pipeline.cli:main"

[tool.setuptools]
license-files = ["licenses/*.txt", "THIRD_PARTY.md"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["msc*", "data_pipeline*"]
exclude = ["data_pipeline.tests*"]
namespaces = false

[tool.setuptools.package-data]
msc = ["assets/stats/*.json", "assets/robots/g1/*.json", "assets/robots/g1/*.urdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires local MSC Releases or T5 assets"]
