# Paths are relative to this YAML. No models are downloaded.
source:
  dataset: gdance
  root: ../../data/processed/AIOZ-GDance-single-person
motion:
  target_fps: 30
  representation: g1_qpos36
  retarget:
    enabled: auto
    gmr_root: ../../../GMR
    smpl_model: ../../model/smplx/SMPLX_NEUTRAL.npz
    gender: neutral
  tracking:
    enabled: true
    onnx: ../../model/holomotion/model.onnx
    providers: CPUExecutionProvider
audio:
  enabled: true
  model: ../../model/MERT-v1-95M
  device: cuda:0
  chunk_seconds: 5
video:
  enabled: false
text:
  enabled: false
quality:
  strict_joint_limits: false
  arm_twist:
    enabled: true
release:
  output: ../../data/processed/audio/gdance
  publish_labels:
  - retarget_reference
  - tracker_executed
  train_default: tracker_executed
  max_shard_frames: 1000000
  split_policy: preserve
  alignment_policy: allow_estimated
