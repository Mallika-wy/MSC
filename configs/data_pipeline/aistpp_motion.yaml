# Paths are relative to this YAML. All durable models live under MSC/model.
dataset: aistpp
root: ../../data/raw_audio/AISTpp
output: ../../data/processed/audio/aistpp
retarget:
  gmr_root: ../../../GMR
  smpl_model: ../../model/smpl/SMPL_MALE.pkl
  gender: male
tracker:
  onnx: ../../model/holomotion/model.onnx
  providers: CPUExecutionProvider
audio:
  model: ../../model/MERT-v1-95M
  device: cuda:0
  chunk_seconds: 5
quality:
  strict_joint_limits: false
  arm_twist:
    enabled: true
