version: 1
# Full local c01 corpus, PROTOTYPE ONLY. No auto-start or original-video deletion.
# Run `prepare --source aistpp --root data/AIST++` first.
input_csv: data/AIST++/pairs.csv
sequences: []  # All sequences in CSV.
retarget:
  gmr_root: ../GMR
  # Explicit existing approximation, not the official AIST male SMPL model.
  # Before production: supply the licensed male model, set gender: male,
  # and allow_nonofficial_model: false; validate the retargeting policy first.
  smpl_model: ../baseline/motion-diffusion-model/body_models/smpl/SMPL_NEUTRAL.pkl
  gender: neutral
  allow_nonofficial_model: true
  dependency_site: /home1/gmh/anaconda3/envs/gmr/lib/python3.10/site-packages
execution:
  onnx: models/holomotion/motion_tracking/model.onnx
  providers: CPUExecutionProvider
video_preprocess:
  enabled: true
  weights: models/person_detection/yolo11n.pt
  device: cpu  # VS Code prompts and overrides this via --video-device.
  output_size: 512
  fps: 30
  margin: 1.3
  crf: 22
  preview: false
quality:
  strict_joint_limits: false  # Record violations; not an official feasibility guarantee.
  arm_twist:
    enabled: true
split:
  ratios: [0.8, 0.1, 0.1]
  seed: 0
export:
  repo_id: local/aistpp-full-prototype
  episode_frames: 240
  stride_frames: 120
output:
  root: data/processed/aistpp_full_prototype
