# Real paired Audio overfit using the AIST++ Train split.
model:
  hidden_dim: 512
  num_layers: 6
  num_heads: 8
  ffn_dim: 2048
  use_text: false
  condition:
    fusion: token_cross_attention
    temporal_bias: relative_distance
    history_dropout: 0.0
    text: {enabled: false, frozen: true}
    audio: {enabled: true, backend: mert_v1_95m, frozen: true, dim: 768, dropout: 0.1}
    video: {enabled: false, frozen: true}
  losses:
    joint_velocity: 0.05
    joint_acceleration: 0.01
    dynamic_normalization: train_stats
    dynamic_warmup_steps: 100
  rtc: false
data:
  backend: msc_release
  roots: [data/processed/audio/aistpp/release]
  split: train
  label_policy: train_default
  alignment_policy: allow_estimated
  tasks: [audio]
  num_workers: 2
  max_motions_per_task: 8
  max_windows_per_motion: 16
train:
  device: cuda:1
  precision: bf16
  batch_size: 8
  accumulation_steps: 1
  steps: 200
  learning_rate: 0.0001
  warmup_steps: 0
  schedule_steps: 1000
  validation_every: 0
  checkpoint_every: 200
  log_every: 10
  output_dir: .runs/trimodal-audio-overfit
